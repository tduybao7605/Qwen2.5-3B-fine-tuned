services:
  cadebot-api:
    build: .
    container_name: cadebot-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside Dify's network, address it by the service name "nginx" rather
      # than "localhost" — in a container, localhost is the container itself,
      # not the host. This overrides DIFY_BASE_URL from .env.
      DIFY_BASE_URL: http://nginx/v1
    ports:
      # Host port 8000 — this is what the Cloudflare Tunnel points at.
      - "8000:8000"
    volumes:
      # Model + LoRA adapter — never baked into the image, mounted from the repo.
      - ./cadebot-lora:/app/cadebot-lora:ro
      # HuggingFace cache (Qwen2.5-3B base + PhoWhisper-large) — downloaded once,
      # reused across rebuilds and restarts. `make clean` destroys it.
      - hf_cache:/root/.cache/huggingface
    networks:
      - default
      - dify_network

networks:
  default:
  # Dify's stack network (its compose project is named "docker", so the network
  # is "docker_default"). Dify must already be up: run `docker compose up` in
  # <path-to>/dify/docker first, or this service fails to start.
  dify_network:
    external: true
    name: docker_default

volumes:
  hf_cache:
