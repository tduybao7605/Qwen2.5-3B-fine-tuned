name: Feature request
description: Suggest a change or an addition
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, slow, or impossible today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like to happen, and roughly where in the codebase it would live.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you looked at, and why you set them aside.
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API server
        - RAG / retrieval
        - STT
        - Model / fine-tuning
        - Android client
        - Docker / deployment
        - Docs
    validations:
      required: false

  - type: checkboxes
    id: measured
    attributes:
      label: Measured values
      description: >
        Several defaults in this repo were chosen by measurement — the retrieval
        threshold, generation temperature, chunk limits, the `use_rag` default.
        See CONTRIBUTING.md.
      options:
        - label: This proposal changes one of those defaults, and I can supply fresh numbers
          required: false
